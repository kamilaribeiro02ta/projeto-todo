<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar filme | CineCRUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="index.html">← Voltar</a>
    <div class="topbar-right">
      <span class="eyebrow">Melissa e Bonfim</span>
      <h1>Editar filme</h1>
    </div>
  </header>

  <main class="container form-page">
    <section class="form-card">
      <div class="form-heading">
        <span class="badge">Edição</span>
        <h2>Atualizar filme</h2>
        <p>Altere os dados e salve as mudanças.</p>
      </div>

      <form id="formEdicao">
        <div class="form-grid">
          <label>
            Título
            <input id="titulo" required maxlength="80" />
          </label>

          <label>
            Gênero
            <input id="genero" required maxlength="40" />
          </label>

          <label>
            Ano
            <input id="ano" type="number" required min="1888" max="2100" />
          </label>

          <label>
            Nota
            <input id="nota" type="number" required min="0" max="10" step="0.1" />
          </label>

          <label class="full">
            URL do pôster
            <input id="poster" type="url" placeholder="https://..." />
          </label>

          <label class="full">
            Sinopse
            <textarea id="sinopse" required maxlength="500" rows="5"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <a class="btn btn-secondary" href="index.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar alterações</button>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
